server {
  listen 8080;
  server_name _;

  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  error_page 403 /403.html;

  location = /403.html {
    internal;
  }

  client_max_body_size 25m;
  client_body_timeout 60s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://bridge-portal-api-268827847108.asia-southeast1.run.app https://*.googleapis.com https://*.firebaseio.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://login.microsoftonline.com https://*.b2clogin.com; frame-src 'self' https://*.firebaseapp.com https://login.microsoftonline.com https://*.b2clogin.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://login.microsoftonline.com https://*.b2clogin.com; worker-src 'self' blob:; manifest-src 'self';" always;

  # Forward API requests to Cloud Run backend
  location /api/ {
    proxy_pass https://bridge-portal-api-268827847108.asia-southeast1.run.app;

    # Required for Cloud Run HTTPS upstream
    proxy_ssl_server_name on;

    # Preserve request information
    proxy_set_header Host bridge-portal-api-268827847108.asia-southeast1.run.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Preserve authentication headers
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
  }


  # React SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}