server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;
  client_body_timeout 60s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;


  # Forward API requests to Cloud Run backend
  location /api/ {
    proxy_pass https://bridge-portal-api-268827847108.asia-southeast1.run.app;

    # Required for Cloud Run HTTPS upstream
    proxy_ssl_server_name on;

    # Preserve request information
    proxy_set_header Host bridge-portal-api-268827847108.asia-southeast1.run.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Preserve authentication headers
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
  }


  # React SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}