<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bridge Contract Status Portal</title>
    <script>
      const PURGE_VERSION = "1.5";
      if ('caches' in window && !localStorage.getItem('_sys_p2_' + PURGE_VERSION)) {
          caches.keys().then(names =>
              Promise.all(names.map(name => caches.delete(name)))
          );

          localStorage.setItem('_sys_p2_' + PURGE_VERSION, 'true');
      }

      if (!localStorage.getItem('_sys_p2_' + PURGE_VERSION)) {
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) {
              caches.delete(name);
            }
            console.log("[System] Global Cache Purge executed.");
          });
        } else {
          console.log("[System] Cache API not available. Skipping purge.");
        }

        localStorage.setItem('_sys_p2_' + PURGE_VERSION, 'true');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
