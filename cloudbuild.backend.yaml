substitutions:
  _REGION: asia-southeast1
  _SERVICE: bridge-portal-api
  _REPOSITORY: bridge-portal

steps:
  # =========================================================
  # BUILD BACKEND
  # =========================================================
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - backend

  # =========================================================
  # PUSH BACKEND IMAGE
  # =========================================================
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  # =========================================================
  # DEPLOY BACKEND TO CLOUD RUN
  # =========================================================
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=bridge-portal-api@$PROJECT_ID.iam.gserviceaccount.com

      # =====================================================
      # ENVIRONMENT VARIABLES
      # =====================================================
      - --set-env-vars=^@^GCP_PROJECT_ID=$PROJECT_ID@AUTH_PROVIDER=hybrid@ADB2C_TENANT_NAME=celcomdigib2c@ADB2C_TENANT_ID=f39b3666-7b5e-4b88-892a-37d49585e91b@ADB2C_POLICY=B2C_1_sign_in_with_id@ADB2C_CLIENT_ID=b6389e9c-e12e-4050-ae0f-a0b8cde047ea@ADB2C_REDIRECT_URI=https://bridge-portal-268827847108.asia-southeast1.run.app/login@EMPLOYEE_ENTRA_TENANT_ID=bf048976-7110-4e87-96f3-c6744908b8be@EMPLOYEE_ENTRA_CLIENT_ID=451ac92f-1a4b-43e3-be18-0a42e9d9b59a@EMPLOYEE_ENTRA_REDIRECT_URI=https://bridge-portal-268827847108.asia-southeast1.run.app/auth/employee/callback@ALLOWED_ORIGINS=http://localhost:3000,http://localhost:4173,http://10.18.160.164:3000,http://10.18.160.164:4173,https://bridge-portal-268827847108.asia-southeast1.run.app,https://bridge-portal-api-268827847108.asia-southeast1.run.app

      # =====================================================
      # EXISTING SECRETS
      # =====================================================
      - --update-secrets=FIRESTORE_DATABASE_ID=FIRESTORE_DATABASE_ID:latest,ADB2C_CLIENT_SECRET=ADB2C_CLIENT_SECRET:latest,EMPLOYEE_ENTRA_CLIENT_SECRET=EMPLOYEE_ENTRA_CLIENT_SECRET:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY